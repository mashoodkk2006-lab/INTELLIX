<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Achievements | Association Admin Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="dashboard-sidebar-container"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div>
          <h3 style="font-size: 1.15rem;">Achievements & Hall of Fame</h3>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add New Achievement</button>
        </div>
      </header>

      <div class="dashboard-content">
        <div class="card">
          <div class="card-body" style="padding: 1.5rem;">
            <div class="table-container">
              <table class="table" id="ach-table">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Winner / Team</th>
                    <th>Position</th>
                    <th>Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td colspan="5" style="text-align: center; padding: 2.5rem;"><span class="spinner"></span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Achievement Modal -->
  <div class="modal-backdrop" id="ach-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Add Department Achievement</h3>
        <button class="modal-close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="ach-form">
          <div class="form-group">
            <label class="form-label">Achievement Title <span class="required-star">*</span></label>
            <input type="text" name="title" class="form-control" placeholder="" required>
          </div>
          <div class="form-group">
            <label class="form-label">Student or Team Name <span class="required-star">*</span></label>
            <input type="text" name="student_team_name" class="form-control" placeholder="" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Position / Rank <span class="required-star">*</span></label>
              <input type="text" name="position" class="form-control" placeholder="" required>
            </div>
            <div class="form-group">
              <label class="form-label">Event Date <span class="required-star">*</span></label>
              <input type="date" name="event_date" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Summary / Description</label>
            <textarea name="description" class="form-control" placeholder=""></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Photo / Trophy Image (Optional)</label>
            <input type="file" name="image" class="form-control" accept="image/*">
          </div>

          <div class="modal-footer" style="padding-left:0; padding-right:0;">
            <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-ach-btn">Save Achievement</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/dashboard/js/dashboard-common.js"></script>
  <script>
    let achievements = [];

    async function loadAchievements() {
      try {
        const res = await fetchJson('/api/achievements');
        if (res.success) {
          achievements = res.achievements;
          renderTable();
        }
      } catch (e) {}
    }

    function renderTable() {
      const tbody = document.querySelector('#ach-table tbody');
      if (achievements.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No achievements recorded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = achievements.map(a => `
        <tr>
          <td style="font-weight: 700;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              ${a.image_url ? `<img src="${a.image_url}" alt="${a.title}" style="width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border-color); flex-shrink: 0;">` : `<div style="width: 42px; height: 42px; border-radius: 6px; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; border: 1px solid var(--border-color);">🏆</div>`}
              <div>
                <div>${a.title}</div>
                ${a.event_title ? `<small style="color: var(--text-muted);">${a.event_title}</small>` : ''}
              </div>
            </div>
          </td>
          <td>${a.student_team_name}</td>
          <td><span class="badge badge-warning">${a.position}</span></td>
          <td>${formatDate(a.event_date)}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteAch(${a.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openAddModal() {
      document.getElementById('ach-modal').classList.add('open');
    }
    function closeAddModal() {
      document.getElementById('ach-modal').classList.remove('open');
    }

    async function deleteAch(id) {
      if (!confirm('Are you sure you want to delete this achievement?')) return;
      try {
        const res = await fetchJson(`/api/achievements/${id}`, { method: 'DELETE' });
        if (res.success) {
          showToast('Achievement removed', 'success');
          loadAchievements();
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAchievements();

      document.getElementById('ach-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = document.getElementById('save-ach-btn');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width: 14px; height: 14px; border-width: 2px; display: inline-block; vertical-align: middle; margin-right: 6px;"></span> Saving...';

        const formData = new FormData(form);
        const imageInput = form.querySelector('input[name="image"]');
        if (imageInput && (!imageInput.files || imageInput.files.length === 0)) {
          formData.delete('image');
        }

        try {
          const res = await fetchJson('/api/achievements', {
            method: 'POST',
            body: formData
          });
          if (res.success) {
            showToast('Achievement added successfully', 'success');
            closeAddModal();
            form.reset();
            loadAchievements();
          }
        } catch (err) {
          showToast(err.message || 'Failed to create achievement', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = origText;
        }
      });
    });
  </script>
</body>
</html>
