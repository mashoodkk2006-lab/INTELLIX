<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Association Members | Admin Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="dashboard-sidebar-container"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div>
          <h3 style="font-size: 1.15rem;">Association Executive Board</h3>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="openMemberModal()">+ Add Member</button>
        </div>
      </header>

      <div class="dashboard-content">
        <div class="card">
          <div class="card-body" style="padding: 1.5rem;">
            <div class="table-container">
              <table class="table" id="members-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Role / Position</th>
                    <th>Department</th>
                    <th>Bio</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td colspan="5" style="text-align: center; padding: 2.5rem;"><span class="spinner"></span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Member Modal -->
  <div class="modal-backdrop" id="member-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Add Committee Member</h3>
        <button class="modal-close-btn" onclick="closeMemberModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="member-form">
          <div class="form-group">
            <label class="form-label">Full Name <span class="required-star">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Position / Role <span class="required-star">*</span></label>
              <input type="text" name="role" class="form-control" placeholder="" required>
            </div>
            <div class="form-group">
              <label class="form-label">Department <span class="required-star">*</span></label>
              <select name="department" class="form-select" required>
                <option value="">Select Department</option>
                <option value="AI&ML">AI&ML</option>
                <option value="CSE">CSE</option>
                <option value="CYBER SECURITY">CYBER SECURITY</option>
                <option value="AUTOMOBILE">AUTOMOBILE</option>
                <option value="MECHANICAL">MECHANICAL</option>
                <option value="BIOMEDICAL">BIOMEDICAL</option>
                <option value="ELECTRICAL AND ELECTRONICS">ELECTRICAL AND ELECTRONICS</option>
                <option value="BBA">BBA</option>
                <option value="BCA">BCA</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Short Bio</label>
            <textarea name="short_bio" class="form-control" placeholder=""></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Photo (Optional)</label>
            <input type="file" name="photo" class="form-control" accept="image/*">
          </div>

          <div class="modal-footer" style="padding-left:0; padding-right:0;">
            <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-member-btn">Save Member</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/dashboard/js/dashboard-common.js"></script>
  <script>
    let membersList = [];

    async function loadMembers() {
      try {
        const res = await fetchJson('/api/members');
        if (res.success) {
          membersList = res.members;
          renderMembersTable();
        }
      } catch (e) {
        console.error("Failed to load members:", e);
        showToast("Failed to fetch members", "error");
      }
    }

    function renderMembersTable() {
      const tbody = document.querySelector('#members-table tbody');
      if (!membersList || membersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No members added yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = membersList.map(m => `
        <tr>
          <td style="font-weight: 700;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              ${m.photo_url ? `<img src="${m.photo_url}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">` : `<div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;">${m.name.charAt(0)}</div>`}
              ${m.name}
            </div>
          </td>
          <td><span class="badge">${m.role}</span></td>
          <td>${m.department}</td>
          <td style="font-size: 0.85rem; color: var(--text-secondary); max-width: 320px;">${m.short_bio || '-'}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteMember(${m.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openMemberModal() { document.getElementById('member-modal').classList.add('open'); }
    function closeMemberModal() { document.getElementById('member-modal').classList.remove('open'); }

    async function deleteMember(id) {
      if (!confirm('Remove member?')) return;
      try {
        const res = await fetchJson(`/api/members/${id}`, { method: 'DELETE' });
        if (res.success) {
          showToast('Member removed', 'success');
          loadMembers();
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadMembers();

      document.getElementById('member-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);

        try {
          const res = await fetchJson('/api/members', {
            method: 'POST',
            body: formData
          });
          if (res.success) {
            showToast('Member added successfully', 'success');
            closeMemberModal();
            form.reset();
            loadMembers();
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
