<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Sheet | Association Admin Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .att-toggle-btn {
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .att-toggle-btn.active-present {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border-color: #22c55e;
    }
    .att-toggle-btn.active-absent {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="dashboard-sidebar-container"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div>
          <h3 style="font-size: 1.15rem;">Event Attendance Sheet</h3>
        </div>
        <div>
          <a href="/dashboard/certificates.html" class="btn btn-outline btn-sm">Proceed to Certificates &rarr;</a>
        </div>
      </header>

      <div class="dashboard-content">
        <!-- Event Selector & Live Attendance Counter -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-body" style="padding: 1.25rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
              <div class="form-group" style="margin-bottom: 0; width: 300px;">
                <label class="form-label">Select Event</label>
                <select id="event-select" class="form-select"></select>
              </div>

              <!-- Real-time metrics -->
              <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div class="card" style="padding: 0.6rem 1rem; text-align: center; border-color: #22c55e;">
                  <span style="font-size: 0.75rem; color: var(--text-muted);">Present</span>
                  <span style="font-size: 1.25rem; font-weight: 700; color: #4ade80;" id="stat-present">0</span>
                </div>
                <div class="card" style="padding: 0.6rem 1rem; text-align: center; border-color: #ef4444;">
                  <span style="font-size: 0.75rem; color: var(--text-muted);">Absent</span>
                  <span style="font-size: 1.25rem; font-weight: 700; color: #f87171;" id="stat-absent">0</span>
                </div>
                <div class="card" style="padding: 0.6rem 1rem; text-align: center;">
                  <span style="font-size: 0.75rem; color: var(--text-muted);">Unmarked</span>
                  <span style="font-size: 1.25rem; font-weight: 700;" id="stat-unmarked">0</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Attendance Table -->
        <div class="card">
          <div class="card-body" style="padding: 1.5rem;">
            <div style="margin-bottom: 1rem;">
              <input type="text" id="filter-participant" class="form-control" placeholder="" style="max-width: 320px;">
            </div>

            <div class="table-container">
              <table class="table" id="attendance-table">
                <thead>
                  <tr>
                    <th>Participant</th>
                    <th>Register Number</th>
                    <th>Registration ID</th>
                    <th>Department</th>
                    <th>Current Status</th>
                    <th>Toggle Attendance</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td colspan="6" style="text-align: center; padding: 2.5rem;"><span class="spinner"></span></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/dashboard/js/dashboard-common.js"></script>
  <script>
    let currentEventId = null;
    let participants = [];

    async function initPage() {
      try {
        const res = await fetchJson('/api/events');
        if (res.success && res.events.length > 0) {
          const select = document.getElementById('event-select');
          select.innerHTML = res.events.map(e => `<option value="${e.id}">${e.code}: ${e.title}</option>`).join('');

          const urlParams = new URLSearchParams(window.location.search);
          const initial = urlParams.get('eventId');
          if (initial) select.value = initial;

          currentEventId = select.value;
          select.addEventListener('change', () => {
            currentEventId = select.value;
            loadParticipants();
          });

          loadParticipants();
        }
      } catch (e) {}
    }

    async function loadParticipants() {
      if (!currentEventId) return;
      try {
        const res = await fetchJson(`/api/events/${currentEventId}/registrations`);
        if (res.success) {
          participants = res.registrations;
          updateCounters();
          renderAttendanceTable();
        }
      } catch (err) {
        document.querySelector('#attendance-table tbody').innerHTML = `
          <tr><td colspan="6" style="text-align: center; color: #ef4444;">Failed to load attendance list: ${err.message}</td></tr>
        `;
      }
    }

    function updateCounters() {
      const present = participants.filter(p => p.attendance_status === 'present').length;
      const absent = participants.filter(p => p.attendance_status === 'absent').length;
      const unmarked = participants.filter(p => !p.attendance_status || p.attendance_status === 'unmarked').length;

      document.getElementById('stat-present').innerText = present;
      document.getElementById('stat-absent').innerText = absent;
      document.getElementById('stat-unmarked').innerText = unmarked;
    }

    function renderAttendanceTable() {
      const query = document.getElementById('filter-participant').value.toLowerCase().trim();
      const tbody = document.querySelector('#attendance-table tbody');

      const filtered = participants.filter(p =>
        !query ||
        p.full_name.toLowerCase().includes(query) ||
        p.register_number.toLowerCase().includes(query) ||
        p.registration_code.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2.5rem;">No registered participants found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const isPresent = p.attendance_status === 'present';
        const isAbsent = p.attendance_status === 'absent';

        return `
          <tr>
            <td style="font-weight: 700;">${p.full_name}</td>
            <td>${p.register_number}</td>
            <td><code style="font-size: 0.85rem;">${p.registration_code}</code></td>
            <td>${p.department} (${p.semester})</td>
            <td>
              <span class="badge ${isPresent ? 'badge-success' : (isAbsent ? 'badge-danger' : '')}">
                ${p.attendance_status || 'unmarked'}
              </span>
            </td>
            <td>
              <div style="display: flex; gap: 0.5rem;">
                <button class="att-toggle-btn ${isPresent ? 'active-present' : ''}" onclick="setAttendance(${p.id}, 'present')">
                  ✓ Present
                </button>
                <button class="att-toggle-btn ${isAbsent ? 'active-absent' : ''}" onclick="setAttendance(${p.id}, 'absent')">
                  ✗ Absent
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function setAttendance(registrationId, status) {
      try {
        const res = await fetchJson('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_id: registrationId, status })
        });

        if (res.success) {
          const item = participants.find(p => p.id === registrationId);
          if (item) item.attendance_status = status;
          updateCounters();
          renderAttendanceTable();
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPage();
      document.getElementById('filter-participant').addEventListener('input', renderAttendanceTable);
    });
  </script>
</body>
</html>
